services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: acquisition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD explicitly}
      POSTGRES_DB: acquisition_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acquisition -d acquisition_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - identity-pg:/var/lib/postgresql/data
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - tengdao-redis:/data
volumes:
  identity-pg:
  tengdao-redis:
